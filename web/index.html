<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Africa 2 Ice: Paleolithic Dispersal</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #141d26; }
      #game { display: block; }
      #loader { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #e8ddc5; font: 16px system-ui, sans-serif; pointer-events: none; text-align: center; }
      #loader-card { max-width: 680px; pointer-events: auto; user-select: text; }
      #loader-title { font-size: 18px; }
      #loader-detail { display: none; margin-top: 12px; color: #bdc8c8; line-height: 1.5; white-space: pre-line; }
      #loader[data-state="error"] #loader-title { color: #f0bd91; }
      #loader[data-state="error"] #loader-detail { display: block; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="loader" role="status">
      <div id="loader-card">
        <div id="loader-title">Loading Africa 2 Ice…</div>
        <div id="loader-detail"></div>
      </div>
    </div>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      const loader = document.getElementById("loader");
      const loaderTitle = document.getElementById("loader-title");
      const loaderDetail = document.getElementById("loader-detail");
      const showBootError = (title, detail, error) => {
        loader.dataset.state = "error";
        loaderTitle.textContent = title;
        loaderDetail.textContent = detail;
        if (error) console.error("wasm.boot", error);
      };
      document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") event.preventDefault();
      });
      if (location.protocol === "file:") {
        showBootError(
          "Africa 2 Ice needs a local web server",
          "Chrome does not allow this page to load main.wasm from a file:// URL.\n" +
            "In the repository, run: python3 -m http.server --directory web 8080\n" +
            "Then open: http://localhost:8080/",
        );
      } else {
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
          .then(result => go.run(result.instance))
          .catch(error => showBootError(
            "Africa 2 Ice could not start",
            "Check the browser console for details, rebuild with ./build_web.sh --dev, and reload.",
            error,
          ));
      }
    </script>
  </body>
</html>
