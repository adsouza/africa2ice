name: Native release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Dry run. Exercises verification, the native matrix, packaging, archive
  # manifests, and checksums against the current branch, stopping short of
  # publishing: the tag gate below and the release-creating step at the end are
  # the only two steps restricted to a tag push. Archives are then named after
  # the branch rather than a tag, which the suffix matching downstream ignores;
  # dispatch from a branch whose name has no slash, since the name becomes part
  # of the archive filename.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ":99.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require an annotated tag reachable from main
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/web-e2e/package-lock.json
      - name: Install native, browser, and release-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli libasound2-dev libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
          curl -L --fail --output binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  binaryen.tar.gz" | sha256sum --check
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_132/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          npm --prefix tools/web-e2e ci
          npm --prefix tools/web-e2e run install-browser
      - name: Start Linux virtual display
        run: Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
      - run: golangci-lint config verify
      - run: golangci-lint run
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: GOOS=js GOARCH=wasm go build -o /dev/null .
      - run: ./build_web.sh --release
      - run: node tools/run_wasm_go_tests.mjs
      - run: node tools/run_wasm_checkpoint.mjs
      - run: npm --prefix tools/web-e2e test
      - run: npm --prefix tools/web-e2e run profile
      - run: ./tools/check_wasm_size.sh web/main.wasm wasm-size.json
      - run: ./tools/check_release_readiness.sh
      - name: Record verified release identity
        shell: bash
        run: |
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "revision=$GITHUB_SHA"
            echo "go=$(go version)"
            echo "binaryen=$(wasm-opt --version)"
            echo "playwright=$(node -p "require('./tools/web-e2e/node_modules/playwright/package.json').version")"
            go run ./tools/release_identity
            echo "wasm_measurements=$(tr -d '\n ' < wasm-size.json)"
            echo "performance_profile_sha256=$(sha256sum performance-profile.json | cut -d' ' -f1)"
            if git diff --quiet && git diff --cached --quiet; then
              echo "tracked_tree=clean"
            else
              echo "tracked_tree=modified"
            fi
          } > release-record.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          path: |
            release-record.txt
            reference-checkpoints.json
            wasm-size.json
            performance-profile.json

  build-native:
    needs: verify
    env:
      DISPLAY: ":99.0"
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            goarch: amd64
            platform: linux
            executable: africa2ice
            format: tar
          - os: windows-2025
            goarch: amd64
            platform: windows
            executable: africa2ice.exe
            format: zip
          - os: macos-15
            goarch: arm64
            platform: macos
            executable: africa2ice
            format: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - name: Verify native architecture
        shell: bash
        run: test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - name: Install Linux graphics and audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
      - name: Start Linux virtual display
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
      - name: Build and smoke native executable
        shell: bash
        run: |
          archive="africa2ice-$GITHUB_REF_NAME-${{ matrix.platform }}-${{ matrix.goarch }}"
          mkdir -p "dist/$archive"
          go build -trimpath -o "dist/$archive/${{ matrix.executable }}" .
          cp LICENSE THIRD_PARTY_NOTICES.md RUNNING.md "dist/$archive/"
          if test "${{ matrix.format }}" = zip; then
            # GitHub's Windows images ship 7-Zip but neither zip nor unzip, so
            # Info-ZIP is not available to either pack here or extract in
            # tools/check_release_archive.sh.
            sevenzip=$(command -v 7z || command -v 7zz) || {
              echo "no 7-Zip on PATH to package a zip archive" >&2
              exit 1
            }
            (cd dist && "$sevenzip" a -tzip -bso0 -bsp0 "$archive.zip" "$archive")
            artifact="dist/$archive.zip"
          else
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
            artifact="dist/$archive.tar.gz"
          fi
          ./tools/check_release_archive.sh "$artifact" "${{ matrix.executable }}" "$GITHUB_SHA"
      - name: Produce exact-tag native reference checkpoints
        shell: bash
        run: go run . -headless -turns 400 -seed 0x9e3779b97f4a7c15 -policy reference -checkpoint-json tag-reference-checkpoints.json > tag-reference-headless.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}-${{ matrix.goarch }}
          path: dist/africa2ice-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.goarch }}.*
          if-no-files-found: error
      - name: Upload exact-tag native reference checkpoints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tag-checkpoints-${{ matrix.platform }}-${{ matrix.goarch }}
          path: tag-reference-checkpoints.json
          if-no-files-found: error

  cross-target-determinism:
    needs: [verify, build-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verification
          path: checkpoints/chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tag-checkpoints-*
          path: checkpoints/native
      - name: Require byte-identical exact-tag checkpoint records
        shell: bash
        run: |
          chromium=checkpoints/chromium/reference-checkpoints.json
          test -s "$chromium"
          for target in linux-amd64 windows-amd64 macos-arm64; do
            native="checkpoints/native/tag-checkpoints-$target/tag-reference-checkpoints.json"
            test -s "$native"
            cmp "$chromium" "$native"
          done

  publish:
    needs: [build-native, cross-target-determinism]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Verify archive manifests and create checksums
        shell: bash
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 3
          for archive in release/*; do
            case "$archive" in
              *-windows-amd64.zip) executable=africa2ice.exe ;;
              *-linux-amd64.tar.gz | *-macos-arm64.tar.gz) executable=africa2ice ;;
              *) echo "unexpected release payload: $archive" >&2; exit 1 ;;
            esac
            ./tools/check_release_archive.sh "$archive" "$executable"
          done
          (cd release && sha256sum africa2ice-* > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Publish immutable GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Africa 2 Ice $GITHUB_REF_NAME" \
            --notes "Unsigned portable v1 archives. Verify SHA256SUMS before using your operating system's one-time unrecognized-developer override."
