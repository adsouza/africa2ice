name: Native release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require an annotated tag reachable from main
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/web-e2e/package-lock.json
      - name: Install native, browser, and release-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
          curl -L --fail --output binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
          echo "b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  binaryen.tar.gz" | sha256sum --check
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_131/bin" >> "$GITHUB_PATH"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          npm --prefix tools/web-e2e ci
          npm --prefix tools/web-e2e run install-browser
      - run: golangci-lint config verify
      - run: golangci-lint run
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: GOOS=js GOARCH=wasm go build -o /dev/null .
      - run: ./build_web.sh --release
      - run: node tools/run_wasm_go_tests.mjs
      - run: node tools/run_wasm_checkpoint.mjs
      - run: npm --prefix tools/web-e2e test
      - run: npm --prefix tools/web-e2e run profile
      - run: ./tools/check_wasm_size.sh web/main.wasm wasm-size.json
      - run: ./tools/check_release_readiness.sh
      - name: Record verified release identity
        shell: bash
        run: |
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "revision=$GITHUB_SHA"
            echo "go=$(go version)"
            echo "binaryen=$(wasm-opt --version)"
            echo "playwright=$(node -p "require('./tools/web-e2e/node_modules/playwright/package.json').version")"
            echo "save_schema=1"
            echo "working_tree=$(test -z "$(git status --porcelain)" && echo clean || echo modified-by-build)"
          } > release-record.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification
          path: |
            release-record.txt
            reference-checkpoints.json
            wasm-size.json
            performance-profile.json

  build-native:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            goarch: amd64
            platform: linux
            executable: africa2ice
            format: tar
          - os: windows-2025
            goarch: amd64
            platform: windows
            executable: africa2ice.exe
            format: zip
          - os: macos-15-intel
            goarch: amd64
            platform: macos
            executable: africa2ice
            format: tar
          - os: macos-15
            goarch: arm64
            platform: macos
            executable: africa2ice
            format: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - name: Verify native architecture
        shell: bash
        run: test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - name: Install Linux graphics headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev
      - name: Build and smoke native executable
        shell: bash
        run: |
          archive="africa2ice-$GITHUB_REF_NAME-${{ matrix.platform }}-${{ matrix.goarch }}"
          mkdir -p "dist/$archive"
          go build -trimpath -o "dist/$archive/${{ matrix.executable }}" .
          cp LICENSE THIRD_PARTY_NOTICES.md RUNNING.md "dist/$archive/"
          if test "${{ matrix.format }}" = zip; then
            (cd dist && zip -qr "$archive.zip" "$archive")
            artifact="dist/$archive.zip"
          else
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
            artifact="dist/$archive.tar.gz"
          fi
          ./tools/check_release_archive.sh "$artifact" "${{ matrix.executable }}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.goarch }}
          path: dist/africa2ice-${{ github.ref_name }}-${{ matrix.platform }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  publish:
    needs: build-native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Verify archive manifests and create checksums
        shell: bash
        run: |
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 4
          for archive in release/*; do
            case "$archive" in
              *-windows-amd64.zip) executable=africa2ice.exe ;;
              *-linux-amd64.tar.gz | *-macos-amd64.tar.gz | *-macos-arm64.tar.gz) executable=africa2ice ;;
              *) echo "unexpected release payload: $archive" >&2; exit 1 ;;
            esac
            ./tools/check_release_archive.sh "$archive" "$executable"
          done
          (cd release && sha256sum africa2ice-* > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Africa 2 Ice $GITHUB_REF_NAME" \
            --notes "Unsigned portable v1 archives. Verify SHA256SUMS before using your operating system's one-time unrecognized-developer override."
