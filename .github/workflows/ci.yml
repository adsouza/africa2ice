name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    env:
      DISPLAY: ":99.0"
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: macos-15
            arch: arm64
          - os: windows-2025
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - name: Verify architecture
        shell: bash
        run: test "$(go env GOARCH)" = "${{ matrix.arch }}"
      - name: Install Linux graphics and audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
      - name: Start Linux virtual display
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint config verify
      - run: golangci-lint run
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Audit citations and third-party licenses
        if: runner.os == 'Linux'
        run: go run ./tools/check_audits
      - name: Test the release tagging preflight
        if: runner.os == 'Linux'
        run: ./tools/release_test.sh
      - name: Produce deterministic reference checkpoints
        shell: bash
        run: go run . -headless -turns 400 -seed 0x9e3779b97f4a7c15 -policy reference -checkpoint-json reference-checkpoints.json > reference-headless.log
      - name: Upload native reference checkpoints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-checkpoints-${{ runner.os }}-${{ matrix.arch }}
          path: reference-checkpoints.json
          if-no-files-found: error

  web-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/web-e2e/package-lock.json
      - name: Install pinned Binaryen and Brotli
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          curl -L --fail --output binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  binaryen.tar.gz" | sha256sum --check
          tar -xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - run: ./build_web.sh --release
      - name: Install pinned browser test tooling
        run: npm --prefix tools/web-e2e ci
      - name: Install pinned Chromium
        run: npm --prefix tools/web-e2e run install-browser
      - name: Exercise Go IndexedDB tests in Chromium
        run: node tools/run_wasm_go_tests.mjs
      - name: Produce Chromium reference checkpoints
        run: node tools/run_wasm_checkpoint.mjs
      - name: Run staged-browser smoke
        run: npm --prefix tools/web-e2e test
      - name: Profile locked top-down browser DPR matrix
        run: npm --prefix tools/web-e2e run profile
      - name: Validate deploy root
        shell: bash
        run: |
          test -s web/index.html
          test -s web/main.wasm
          test -s web/wasm_exec.js
          test ! -e web/main.wasm.gz
          test ! -e web/main.wasm.br
          grep -q 'fetch("main.wasm")' web/index.html
      # The size gate runs in both directions: it fails on growth past the
      # ceiling, and it fails when the ceiling has gone stale enough to stop
      # constraining the build, naming the exact replacement value.
      - name: Measure and gate compressed wasm size
        shell: bash
        env:
          WASM_SIZE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/check_wasm_size.sh web/main.wasm wasm-size.json
      # Recorded even on failure: a gate that only preserves the number when it
      # passes throws the measurement away exactly when it is most wanted.
      - name: Record the size measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-size-${{ github.sha }}
          path: wasm-size.json
          if-no-files-found: warn
      - name: Upload Chromium reference checkpoints
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-checkpoints-Chromium-wasm
          path: reference-checkpoints.json
          if-no-files-found: error
      - name: Upload tested web release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release-bundle
          path: web
          if-no-files-found: error
      - name: Upload browser performance profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-performance-${{ github.sha }}
          path: performance-profile.json
          if-no-files-found: error
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: web

  cross-target-determinism:
    needs: [native, web-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reference-checkpoints-*
          path: checkpoints
      - name: Require byte-identical checkpoint records
        shell: bash
        run: |
          linux=checkpoints/reference-checkpoints-Linux-amd64/reference-checkpoints.json
          macos=checkpoints/reference-checkpoints-macOS-arm64/reference-checkpoints.json
          windows=checkpoints/reference-checkpoints-Windows-amd64/reference-checkpoints.json
          chromium=checkpoints/reference-checkpoints-Chromium-wasm/reference-checkpoints.json
          test -s "$linux" && test -s "$macos" && test -s "$windows" && test -s "$chromium"
          cmp "$linux" "$macos"
          cmp "$linux" "$windows"
          cmp "$linux" "$chromium"

  release-readiness:
    needs: [native, web-release, cross-target-determinism]
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ":99.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.4
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/web-e2e/package-lock.json
      - name: Install graphics, audio, and browser dependencies
        run: sudo apt-get update && sudo apt-get install -y brotli libasound2-dev libgl1-mesa-dev libgl1-mesa-dri libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
      - name: Start Linux virtual display
        run: Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-release-bundle
          path: web
      - run: npm --prefix tools/web-e2e ci
      - run: npm --prefix tools/web-e2e run install-browser
      # The compressed wasm size gate is not repeated here. web-release runs it
      # before it uploads, and this job needs that job, so the bundle downloaded
      # above has already passed against the same budget file and base ref. A
      # second brotli -q 11 pass over the identical bytes costs minutes and can
      # only ever agree, and its record was being discarded rather than uploaded.
      - name: Re-run route and benchmark readiness gates
        run: ./tools/check_release_readiness.sh
      - name: Re-run smoke against the tested optimized bundle
        run: npm --prefix tools/web-e2e test

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, web-release, cross-target-determinism, release-readiness]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Smoke deployed Pages artifact
        shell: bash
        run: |
          base="${{ steps.deployment.outputs.page_url }}"
          for path in "" main.wasm wasm_exec.js; do
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location --output /tmp/pages-body --dump-header /tmp/pages-headers "${base}${path}"; then
                break
              fi
              test "$attempt" -lt 5
              sleep 2
            done
            test -s /tmp/pages-body
            if test "$path" = main.wasm; then
              grep -iq '^content-type: application/wasm' /tmp/pages-headers
            fi
          done
